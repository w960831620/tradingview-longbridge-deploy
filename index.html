<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1117"><title>分层交易系统 V2.2</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{display:grid;place-items:center;min-height:100vh}</style></head><body><div id="boot">正在加载分层交易系统 V2.2…</div><script>(async()=>{const base='./p/';const jsNames=['js.00.txt','js.01.txt','js.02.txt','js.03.txt','js.04.txt','js.05.txt'];async function get(n){const r=await fetch(base+n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.text()}async function gunzip64(s){const bin=atob(s.replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');return new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}const [parts,css64]=await Promise.all([Promise.all(jsNames.map(get)),get('css.00.txt')]);const [js,css]=await Promise.all([gunzip64(parts.join('')),gunzip64(css64)]);const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);document.body.innerHTML='<div id="root"></div>';const script=document.createElement('script');script.type='module';script.textContent=js;document.body.appendChild(script)})().catch(e=>{document.body.innerHTML='<div style="padding:32px;font-family:system-ui"><h2>站点加载失败</h2><p>请刷新页面重试。</p><pre>'+String(e)+'</pre></div>'})</script></body></html>
