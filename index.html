<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1117"><title>分层交易系统 V2.2</title><style>html,body{margin:0;min-height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{display:grid;place-items:center;min-height:100vh}</style></head><body><div id="boot">正在加载分层交易系统 V2.2…</div><script>(async()=>{const base='https://raw.githubusercontent.com/w960831620/tradingview-longbridge-deploy/main/p/';const jsNames=['js.00.txt','js.01.txt','js.02.txt','js.03.txt','js.04.txt','js.05.txt'];async function get(n){const r=await fetch(base+n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);return r.text()}function b64bytes(s){const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';s=s.replace(/[^A-Za-z0-9+/=]/g,'');const out=[];for(let i=0;i<s.length;){let a=A.indexOf(s[i++]),b=A.indexOf(s[i++]),c=s[i++],d=s[i++];if(a<0||b<0)continue;out.push((a<<2)|(b>>4));if(c&&c!='='){c=A.indexOf(c);if(c>=0){out.push(((b&15)<<4)|(c>>2));if(d&&d!='='){d=A.indexOf(d);if(d>=0)out.push(((c&3)<<6)|d)}}}}return new Uint8Array(out)}async function gunzipBytes(bytes){const ds=new DecompressionStream('gzip');return new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}const [parts,css64]=await Promise.all([Promise.all(jsNames.map(get)),get('css.00.txt')]);const decoded=parts.map(b64bytes);const total=decoded.reduce((n,a)=>n+a.length,0);const all=new Uint8Array(total);let off=0;for(const a of decoded){all.set(a,off);off+=a.length}const [js,css]=await Promise.all([gunzipBytes(all),gunzipBytes(b64bytes(css64))]);const style=document.createElement('style');style.textContent=css;document.head.appendChild(style);document.body.innerHTML='<div id="root"></div>';const script=document.createElement('script');script.type='module';script.textContent=js;document.body.appendChild(script)})().catch(e=>{document.body.innerHTML='<div style="padding:32px;font-family:system-ui"><h2>站点加载失败</h2><p>请刷新页面重试。</p><pre>'+String(e)+'</pre></div>'})</script></body></html>
